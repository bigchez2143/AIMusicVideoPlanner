name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependency
        run: python -m pip install "Pillow>=11,<14"
      - name: Python persistence, import, export and HTTP checks
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax and behavior checks
        shell: bash
        run: |
          set -e
          for file in web/*.js; do node --check "$file"; done
          for file in tests/*.test.cjs; do node "$file"; done
